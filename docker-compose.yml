services:
  db:
    image: postgres:16
    container_name: golink-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: golink
      POSTGRES_PASSWORD: golink
      POSTGRES_DB: golink
    ports:
      - "5432:5432"
    volumes:
      - golink_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golink -d golink"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  golink_pgdata:
